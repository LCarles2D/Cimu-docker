services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/Pagina_web_CIMU/public/:/app/public/
    environment:
      - COUCHDB_URL=${COUCHDB_URL}
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/Pagina_web_CIMU/public/:/usr/share/nginx/html/uploads/:ro
    depends_on:
      - frontend
      - couchdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  couchdb:
    image: couchdb:latest
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - couchdb_data:/opt/couchdb/data
volumes:
  couchdb_data:
